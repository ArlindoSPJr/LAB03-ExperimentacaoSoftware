# Configuração do pipeline DORA (Lab03).
# Uso: python -m pipeline --config config.yaml   (token lido de GITHUB_TOKEN)

# Janela de observação de 12 meses, escolhida pelo grupo (o professor aceita qualquer
# período de 12 meses). É a janela definitiva da S01 e da S02: mudá-la exige refazer a coleta.
# ATENÇÃO: window.end precisa estar NO PASSADO. Se a janela ainda não terminou,
# o cache em disco guarda respostas incompletas (releases/runs futuros ficam de fora)
# e a retomada reaproveita esses dados errados.
window:
  start: "2025-10-01"
  end: "2026-09-30"

# Número de repositórios válidos na amostra (100 na S01; >= 300 na S02).
sample_size: 300

# Faixas de estrelas para fatiar a Search API (máx. 1.000 resultados por consulta).
# As 4 faixas atingem o teto (4.000 candidatos; a API devolve os 1.000 primeiros por
# "best match" de cada faixa). Com ~23% de válidos entre os processados (S01: 442 -> 100),
# 300 válidos usam cerca de 1.300 candidatos, então as faixas não foram fatiadas na S02.
# Mudar as faixas muda o conjunto de candidatos e, pelo embaralhamento (random_state=42),
# a amostra inteira.
star_ranges:
  - [1000, 2000]
  - [2000, 5000]
  - [5000, 20000]
  - [20000, 500000]

# Diretório do cache em disco (não versionado).
cache_dir: cache

# Opcional: lista fixa de repositórios ("owner/repo"); se presente, pula a busca.
# repos:
#   - owner/repo
