name: testes
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Cobertura mínima de 80% do módulo metricas (enunciado, seção 7).
      - run: pytest --cov=metricas --cov-report=term-missing --cov-fail-under=80
