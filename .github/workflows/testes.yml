name: testes
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # --cov-fail-under=0 até existirem as métricas; a Issue S01-O3.5 sobe para 80.
      - run: pytest --cov=metricas --cov-report=term-missing --cov-fail-under=0
